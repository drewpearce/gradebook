name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://gradebook:gradebook@localhost:5432/gradebook
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gradebook
          POSTGRES_PASSWORD: gradebook
          POSTGRES_DB: gradebook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gradebook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check

      - name: Format check (ruff)
        run: uv run ruff format --check

      - name: Type check (pyright, strict)
        run: uv run pyright

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Tests (pytest)
        run: uv run pytest
