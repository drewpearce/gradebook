name: Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Client in sync with openapi.json
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts

      - name: Lint (oxlint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Tests (vitest)
        run: npm test

      - name: Build (typechecks via tsc, then bundles)
        run: npm run build
